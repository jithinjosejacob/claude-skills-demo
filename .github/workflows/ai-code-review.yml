name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
  workflow_dispatch:  # Allow manual trigger

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better context

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run AI Code Review
        id: ai-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: node scripts/ci-review.js
        continue-on-error: true

      - name: Upload Review Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-report
          path: claude-review-report.md
          retention-days: 30

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            try {
              const reportPath = 'claude-review-report.md';
              if (fs.existsSync(reportPath)) {
                const review = fs.readFileSync(reportPath, 'utf8');

                // Find existing bot comment
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                });

                const botComment = comments.find(comment =>
                  comment.user.type === 'Bot' &&
                  comment.body.includes('🤖 AI Code Review')
                );

                const commentBody = `🤖 AI Code Review Report\n\n${review}\n\n---\n*Powered by Claude Sonnet 4.5 via CI/CD*`;

                if (botComment) {
                  // Update existing comment
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body: commentBody
                  });
                  console.log('Updated existing review comment');
                } else {
                  // Create new comment
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: commentBody
                  });
                  console.log('Created new review comment');
                }
              } else {
                console.log('Review report not found');
              }
            } catch (error) {
              console.error('Error posting comment:', error);
            }

      - name: Check Review Status
        if: steps.ai-review.outcome == 'failure'
        run: |
          echo "⚠️ AI Review found blocking issues"
          exit 1
